interface:
  display_name: "持久沙盒构建器"
  short_description: "一个入口构建通用、竞技或修仙持久世界，并支持世界扩张、角色生活与长期Gameplay Review"
  default_prompt: "Use $build-sandbox. Select exactly one primary mode: generic, competitive, or cultivation. For living/open-ended worlds, apply the shared six-phase lifecycle: horizon/topology, organizations, actor promotion and character life, relationships/narrative runtime, domain depth, and long-session gameplay hardening. Preserve stable IDs, deterministic materialization, sparse context, independent NPC/world agency, and honest release gates."
