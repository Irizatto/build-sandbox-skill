interface:
  display_name: "持久沙盒构建器"
  short_description: "一个入口构建通用、竞技或修仙持久世界，并保留原三套Skill合同、SillyTavern可玩性与长期Gameplay Review"
  default_prompt: "Use $build-sandbox. Select exactly one primary mode: generic, competitive, or cultivation. First read the preserved contract at modes/<mode>/SKILL.md (and modes/generic/SKILL.md when the selected mode depends on the generic core), resolving vendored relative paths against the mode directory. For living/open-ended worlds, then apply the shared six-phase lifecycle: horizon/topology, organizations, actor promotion and character life, relationships/narrative runtime, domain depth, and long-session gameplay hardening. If the requested deliverable is directly played in SillyTavern, also read references/sillytavern-first-playability.md and prioritize core SillyTavern playability, continuity and bounded context over future-runtime purity; STscript/Quick Replies may enhance but must not rescue a broken core package. Preserve stable IDs, deterministic materialization, sparse context, independent NPC/world agency, mode-specific rules, and honest release gates."
