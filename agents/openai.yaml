interface:
  display_name: "持久沙盒构建器"
  short_description: "构建通用、竞技或修仙持久世界：稳定权威、SillyTavern可玩性、内容密度、受控扩容与长期验证"
  default_prompt: "Use $build-sandbox. Select exactly one primary mode: generic, competitive, or cultivation. First read the mode contract at modes/<mode>/SKILL.md (and modes/generic/SKILL.md when the selected mode depends on the generic core), resolving mode-relative paths against that directory. For living/open-ended worlds, apply the shared six-phase lifecycle and preserve stable IDs, deterministic materialization, sparse context, independent world/NPC agency, and honest release gates. If the requested deliverable is directly played in SillyTavern, read references/sillytavern-first-playability.md and prioritize direct playability, continuity and bounded context over future-runtime purity. For a mature package, freeze and measure the baseline first; treat capability lists as diagnostics rather than quotas and implement only TUNE_EXISTING or IMPLEMENT_GAP changes with clear player-visible return. When architecture is already strong but content feels generic or compartmentalized, read references/content-density-and-controlled-scale.md: research broadly, select narrowly, run a small Pilot, cross-link characters/places/domain practices/history/institutions, then scale in Wave A→class gate→Wave B only if the method remains distinctive and token-safe. For cultivation content, also use modes/cultivation/references/experience-and-openings.md and content-renaissance-and-scale-up.md: bounded auto-drive, Opening Momentum, selective Current Age projection, Tianji epistemic quarantine, technique-as-life, institutional ideology, history-in-present, realm-as-life, mortal substrate and functional exploration. Do not force Orca when the user wants a single implementation owner; direct Muse implementation→self-gate→STOP→independent Codex audit is valid. Reject assert(true)-style evidence and require mutation/blind tests where applicable. World size must not equal prompt size; more play per token is success."
